[package]
name = "blt-store"
version = "0.1.0"
edition.workspace = true
license.workspace = true

[dependencies]
blt-model = { path = "../blt-model" }
serde = { version = "1", features = ["derive"] }
tokio = { workspace = true, features = [
    "macros",
    "rt",
    "rt-multi-thread",
    "sync",
    "test-util",
    "time",
] }

[dev-dependencies]
serde_yaml = "0.9"

[lib]
path = "src/lib.rs"
