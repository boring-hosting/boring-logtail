[package]
name = "blt-emitter"
version = "0.1.0"
edition.workspace = true
license.workspace = true

[dependencies]
blt-model = { path = "../blt-model" }
log = { workspace = true }
reqwest = { workspace = true, features = ["json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { workspace = true, features = ["io-std", "io-util", "rt", "sync", "time"] }

[dev-dependencies]
tokio = { workspace = true, features = ["io-util", "macros", "net", "rt", "sync"] }

[lib]
path = "src/lib.rs"
