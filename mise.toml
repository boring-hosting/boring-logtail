[tasks.build]
description = "Build the release binary"
run = "cargo build --release"

[tasks.run]
description = "Build and run boring-logtail"
depends = ["build"]
run = "target/release/boring-logtail"

[tasks.debug]
description = "Build and expose boring-logtail to LLDB on port 1234"
run = [
  "cargo build",
  "sudo -E lldb-server gdbserver 127.0.0.1:1234 target/debug/boring-logtail",
]

[tasks.publish]
description = "Build and push dated and latest images to the GitLab registry"
run = '''
set -eu

tag="$(date -u +%Y%m%d-%H%M)"
logtail_image="registry.gitlab.com/biomehub/boring-logtail/logtail"
collector_image="registry.gitlab.com/biomehub/boring-logtail/collector"

docker buildx build --provenance=false --target logtail --tag "${logtail_image}:${tag}" --tag "${logtail_image}:latest" .
docker push "${logtail_image}:${tag}"
docker push "${logtail_image}:latest"

docker buildx build --provenance=false --target collector --tag "${collector_image}:${tag}" --tag "${collector_image}:latest" .
docker push "${collector_image}:${tag}"
docker push "${collector_image}:latest"
'''

[tasks.fmt]
description = "Format project"
run = ["cargo fmt"]
