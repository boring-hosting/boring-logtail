name: Publish images

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - target: collector
            image: ghcr.io/boring-hosting/boring-collector
          - target: logtail
            image: ghcr.io/boring-hosting/boring-logtail
          - target: probe
            image: ghcr.io/boring-hosting/boring-probe
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          provenance: true
          sbom: true
          target: ${{ matrix.target }}
          tags: ${{ matrix.image }}:${{ github.sha }}

  promote:
    needs: publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish sortable immutable tags
        shell: bash
        run: |
          commit_epoch="$(git show --no-patch --format=%ct "$GITHUB_SHA")"
          build_timestamp="$(date --utc --date="@$commit_epoch" +%Y%m%dT%H%M%SZ)"
          sortable_tag="main-${build_timestamp}-${GITHUB_SHA:0:7}"

          for image in \
            ghcr.io/boring-hosting/boring-collector \
            ghcr.io/boring-hosting/boring-logtail \
            ghcr.io/boring-hosting/boring-probe
          do
            docker buildx imagetools create \
              --tag "${image}:${sortable_tag}" \
              "${image}:${GITHUB_SHA}"
          done
