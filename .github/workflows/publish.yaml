name: Publish images

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - target: collector
            image: ghcr.io/boring-hosting/boring-collector
          - target: logtail
            image: ghcr.io/boring-hosting/boring-logtail
          - target: probe
            image: ghcr.io/boring-hosting/boring-probe
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          provenance: true
          sbom: true
          target: ${{ matrix.target }}
          tags: ${{ matrix.image }}:${{ github.sha }}
