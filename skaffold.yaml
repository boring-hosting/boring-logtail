apiVersion: skaffold/v4beta13
kind: Config
metadata:
  name: boring-logtail
build:
  tagPolicy:
    gitCommit:
      variant: AbbrevCommitSha
  artifacts:
    - image: ghcr.io/alfredosa/boring-logtail
      context: .
      docker:
        dockerfile: Dockerfile
  local:
    useBuildkit: true
    push: true
manifests:
  rawYaml:
    - k8s/boring-logtail.yaml
deploy:
  kubectl: {}
