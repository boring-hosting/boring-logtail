apiVersion: skaffold/v4beta13
kind: Config
metadata:
  name: boring-logtail
build:
  tagPolicy:
    gitCommit:
      variant: AbbrevCommitSha
  artifacts:
    - image: registry.gitlab.com/biomehub/boring-logtail/logtail
      context: .
      docker:
        dockerfile: Dockerfile
        target: logtail
    - image: registry.gitlab.com/biomehub/boring-logtail/collector
      context: .
      docker:
        dockerfile: Dockerfile
        target: collector
  local:
    useBuildkit: false
    push: true
manifests:
  rawYaml:
    - k8s/boring-logtail.yaml
deploy:
  kubectl: {}
