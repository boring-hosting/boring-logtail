# SPDX-License-Identifier: GPL-3.0-or-later

[workspace]
resolver = "2"
members = [
    "boring-logtail",
    "boring-collector",
    "blt-abi",
    "blt-ebpf",
    "blt-emitter",
    "blt-model",
    "blt-otel",
    "blt-store",
]
default-members = [
    "boring-logtail",
    "boring-collector",
    "blt-abi",
    "blt-emitter",
    "blt-model",
    "blt-otel",
    "blt-store",
]

[workspace.package]
license = "GPL-3.0-or-later"
edition = "2024"

[workspace.dependencies]
aya = { version = "0.14.0", default-features = false }
aya-build = { version = "0.2.0", default-features = false }
aya-ebpf = { version = "0.2.1", default-features = false }
aya-log = { version = "0.3.0", default-features = false }
aya-log-ebpf = { version = "0.2.0", default-features = false }

anyhow = { version = "1", default-features = false }
axum = { version = "0.8", default-features = false, features = ["http1", "tokio"] }
cargo_metadata = { version = "0.23.0", default-features = false }
# `std` feature is currently required to build `clap`.
#
# See https://github.com/clap-rs/clap/blob/61f5ee5/clap_builder/src/lib.rs#L15.
clap = { version = "4.5.20", default-features = false, features = ["std"] }
env_logger = { version = "0.11.5", default-features = false }
libc = { version = "0.2.159", default-features = false }
log = { version = "0.4.22", default-features = false }
opentelemetry-proto = { version = "0.32.0", default-features = false, features = ["gen-tonic-messages", "logs"] }
prost = { version = "0.14", default-features = false }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
tokio = { version = "1.40.0", default-features = false }
which = { version = "6.0.0", default-features = false }

[profile.release.package.blt-ebpf]
debug = 2
codegen-units = 1
strip = false
