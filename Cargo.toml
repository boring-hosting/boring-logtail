# SPDX-License-Identifier: GPL-3.0-or-later

[workspace]
resolver = "2"
members = [
    "boring-logtail",
    "boring-collector",
    "boring-probe",
]
default-members = [
    "boring-logtail",
    "boring-collector",
    "boring-probe",
]

[workspace.package]
license = "GPL-3.0-or-later"
edition = "2024"

[workspace.dependencies]
anyhow = { version = "1", default-features = false }
axum = { version = "0.8", default-features = false, features = ["http1", "tokio"] }
env_logger = { version = "0.11.5", default-features = false }
log = { version = "0.4.22", default-features = false }
opentelemetry-proto = { version = "0.32.0", default-features = false, features = ["gen-tonic", "logs", "metrics"] }
prometheus-client = { version = "0.25.1", default-features = false }
prost = { version = "0.14", default-features = false }
prost-types = { version = "0.14", default-features = false }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
tokio = { version = "1.40.0", default-features = false }
tokio-stream = { version = "0.1", default-features = false }
tonic = { version = "0.14", default-features = false }
tonic-prost = { version = "0.14", default-features = false }
