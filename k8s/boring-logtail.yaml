apiVersion: v1
kind: Namespace
metadata:
  name: boring-logtail
  labels:
    app.kubernetes.io/name: boring-logtail
    app.kubernetes.io/part-of: boring-logtail
    pod-security.kubernetes.io/enforce: privileged
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: boring-logtail
  namespace: boring-logtail
  labels:
    app.kubernetes.io/name: boring-logtail
    app.kubernetes.io/component: collector
    app.kubernetes.io/part-of: boring-logtail
automountServiceAccountToken: true
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: boring-logtail
  namespace: boring-logtail
  labels:
    app.kubernetes.io/name: boring-logtail
    app.kubernetes.io/part-of: boring-logtail
data:
  config.yaml: |
    version: 1
    sampling:
      percent: 100
    store:
      max_memory: 128MiB
      max_workloads: 128
      max_logs: 500
      max_record_bytes: 64KiB
    filters:
      - type: kubernetes-namespace
        include:
          - game-servers
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: boring-logtail-pod-reader
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["apps"]
    resources: ["replicasets"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: boring-logtail-pod-reader
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: boring-logtail-pod-reader
subjects:
  - kind: ServiceAccount
    name: boring-logtail
    namespace: boring-logtail
---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: boring-logtail
  namespace: boring-logtail
  labels:
    app.kubernetes.io/name: boring-logtail
    app.kubernetes.io/component: collector
    app.kubernetes.io/part-of: boring-logtail
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: boring-logtail
      app.kubernetes.io/component: collector
  minReadySeconds: 5
  revisionHistoryLimit: 3
  updateStrategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 0
      maxUnavailable: 1
  template:
    metadata:
      labels:
        app.kubernetes.io/name: boring-logtail
        app.kubernetes.io/component: collector
        app.kubernetes.io/part-of: boring-logtail
    spec:
      serviceAccountName: boring-logtail
      automountServiceAccountToken: true
      terminationGracePeriodSeconds: 30
      tolerations:
        - operator: Exists
          effect: NoSchedule
      containers:
        - name: boring-logtail
          image: ghcr.io/alfredosa/boring-logtail:latest
          imagePullPolicy: IfNotPresent
          env:
            - name: RUST_LOG
              value: info
            - name: BORING_LOGTAIL_NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
            - name: BORING_LOGTAIL_HOST_CGROUP_ROOT
              value: /host/sys/fs/cgroup
            - name: BORING_LOGTAIL_CONFIG
              value: /etc/boring-logtail/config.yaml
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              memory: 192Mi
          securityContext:
            privileged: true
            runAsNonRoot: false
            runAsUser: 0
            runAsGroup: 0
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: true
          volumeMounts:
            - name: tracefs
              mountPath: /sys/kernel/tracing
              readOnly: true
            - name: host-cgroup
              mountPath: /host/sys/fs/cgroup
              readOnly: true
            - name: config
              mountPath: /etc/boring-logtail
              readOnly: true
      volumes:
        - name: tracefs
          hostPath:
            path: /sys/kernel/tracing
            type: Directory
        - name: host-cgroup
          hostPath:
            path: /sys/fs/cgroup
            type: Directory
        - name: config
          configMap:
            name: boring-logtail
