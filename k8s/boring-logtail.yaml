apiVersion: v1
kind: Namespace
metadata:
  name: boring-logtail
  labels:
    app.kubernetes.io/part-of: boring-logtail
    pod-security.kubernetes.io/enforce: privileged
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: boring-logtail
  namespace: boring-logtail
data:
  config.yaml: |
    collector:
      endpoint: http://boring-collector:4318/v1/logs
      queue_records: 1024
      queue_bytes: 8388608
      batch_records: 512
      batch_bytes: 1048576
      flush_interval_ms: 1000
      retry_max_elapsed_ms: 30000
      request_timeout_ms: 10000
    capture:
      assembly_operations: 1024
      assembly_bytes: 4194304
      framing_lanes: 64
      framing_bytes: 8388608
      max_record_bytes: 65536
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: boring-collector
  namespace: boring-logtail
data:
  config.yaml: |
    listen: 0.0.0.0:4318
    max_request_bytes: 4194304
    store:
      max_memory: 128MiB
      max_logs: 500
      retention: 1h
    sampling:
      percent: 100
    filters:
      namespaces:
        include:
          - auth
          - biomehub
          - biomehub-dev
          - factorio-dev
          - flux-system
          - game-servers
    events:
      joined:
        type: info
        message: "Someone has joined!"
      web-app-error:
        type: error
        message: "The Biomehub backend reported an operational failure"
      web-app-auth-warning:
        type: warning
        message: "The Biomehub backend rejected an OIDC token"
    event_catchers:
      - regex: '(?i)\b(?:playfab )?peer connected:\s*PeerId\('
        event: joined
        emitters:
          - discord
      - regex: '(?m)^\d{4}/\d{2}/\d{2} \d{2}:\d{2}:\d{2} ERROR (?:configuration error|failed to initialize (?:storage|kubernetes client|auth middleware)|http server error|server shutdown error|ensure catalog entry|failed to (?:read webhook body|parse subscription event)|webhook signature verification failed|stripe event error)\b'
        event: web-app-error
        emitters:
          - discord
      - regex: '(?m)^(?:\d{4}/\d{2}/\d{2} \d{2}:\d{2}:\d{2} WARN jwtmiddleware error\b|Failed to refresh Dex token Error: Dex rejected the refresh token\b)'
        event: web-app-auth-warning
        emitters:
          - discord
    event_emitters:
      discord:
        channel_id: "1537166176331898890"
        secret_from_env: WOW_MY_DISCORD_SECRET
---
apiVersion: v1
kind: Service
metadata:
  name: boring-collector
  namespace: boring-logtail
spec:
  selector:
    app.kubernetes.io/name: boring-collector
  ports:
    - name: otlp-http
      port: 4318
      targetPort: otlp-http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: boring-collector
  namespace: boring-logtail
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: boring-collector
  template:
    metadata:
      labels:
        app.kubernetes.io/name: boring-collector
        app.kubernetes.io/component: collector
        app.kubernetes.io/part-of: boring-logtail
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 30
      containers:
        - name: boring-collector
          image: ghcr.io/alfredosa/boring-collector:latest
          ports:
            - name: otlp-http
              containerPort: 4318
          env:
            - {name: RUST_LOG, value: info}
            - {name: BORING_COLLECTOR_CONFIG, value: /etc/boring-collector/config.yaml}
            - name: WOW_MY_DISCORD_SECRET
              valueFrom:
                secretKeyRef:
                  name: boring-logtail-discord
                  key: bot-token
          readinessProbe:
            httpGet: {path: /healthz, port: otlp-http}
          livenessProbe:
            httpGet: {path: /healthz, port: otlp-http}
          resources:
            requests: {cpu: 50m, memory: 160Mi}
            limits: {memory: 256Mi}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            capabilities: {drop: [ALL]}
          volumeMounts:
            - {name: config, mountPath: /etc/boring-collector, readOnly: true}
      volumes:
        - name: config
          configMap: {name: boring-collector}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: boring-logtail
  namespace: boring-logtail
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: boring-logtail-pod-reader
rules:
  - apiGroups: [""]
    resources: [pods]
    verbs: [get, list, watch]
  - apiGroups: [apps]
    resources: [replicasets]
    verbs: [get, list, watch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: boring-logtail-pod-reader
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: boring-logtail-pod-reader
subjects:
  - {kind: ServiceAccount, name: boring-logtail, namespace: boring-logtail}
---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: boring-logtail
  namespace: boring-logtail
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: boring-logtail
      # Kept for an in-place upgrade: Deployment selectors are immutable and
      # the original DaemonSet unfortunately called the node process collector.
      app.kubernetes.io/component: collector
  updateStrategy:
    type: RollingUpdate
  template:
    metadata:
      labels:
        app.kubernetes.io/name: boring-logtail
        app.kubernetes.io/component: collector
        app.kubernetes.io/part-of: boring-logtail
    spec:
      serviceAccountName: boring-logtail
      terminationGracePeriodSeconds: 30
      tolerations:
        - {operator: Exists, effect: NoSchedule}
      containers:
        - name: boring-logtail
          image: ghcr.io/alfredosa/boring-logtail:latest
          env:
            - {name: RUST_LOG, value: info}
            # Capture bursts allocate on several Tokio workers. Bound glibc's
            # per-thread arenas and return freed pages instead of pinning the
            # burst high-water mark in every node agent.
            - {name: GLIBC_TUNABLES, value: "glibc.malloc.arena_max=2:glibc.malloc.trim_threshold=131072"}
            - name: BORING_LOGTAIL_NODE_NAME
              valueFrom: {fieldRef: {fieldPath: spec.nodeName}}
            - name: BORING_LOGTAIL_POD_NAME
              valueFrom: {fieldRef: {fieldPath: metadata.name}}
            - {name: BORING_LOGTAIL_HOST_CGROUP_ROOT, value: /host/sys/fs/cgroup}
            - {name: BORING_LOGTAIL_CONFIG, value: /etc/boring-logtail/config.yaml}
          resources:
            requests: {cpu: 50m, memory: 64Mi}
            limits: {memory: 192Mi}
          securityContext:
            privileged: true
            readOnlyRootFilesystem: true
          volumeMounts:
            - {name: tracefs, mountPath: /sys/kernel/tracing, readOnly: true}
            - {name: host-cgroup, mountPath: /host/sys/fs/cgroup, readOnly: true}
            - {name: config, mountPath: /etc/boring-logtail, readOnly: true}
      volumes:
        - name: tracefs
          hostPath: {path: /sys/kernel/tracing, type: Directory}
        - name: host-cgroup
          hostPath: {path: /sys/fs/cgroup, type: Directory}
        - name: config
          configMap: {name: boring-logtail}
