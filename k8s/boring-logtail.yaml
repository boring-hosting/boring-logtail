---
apiVersion: v1
kind: ConfigMap
metadata:
  name: boring-logtail
  namespace: boring-logtail-dev
data:
  config.yaml: |
    collector:
      endpoint: http://boring-collector:4318/v1/logs
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: boring-collector
  namespace: boring-logtail-dev
data:
  config.yaml: |
    listen: 0.0.0.0:4318
    grpc_listen: 0.0.0.0:50051
    max_request_bytes: 4194304
    store:
      max_memory: 128MiB
      max_logs: 500
      retention: 1h
    sampling:
      percent: 100
    filters:
      namespaces:
        include:
          - auth
          - biomehub
          - biomehub-dev
          - factorio-dev
          - flux-system
          - game-servers
    events:
      joined:
        type: info
        message: "Someone has joined!"
      web-app-error:
        type: error
        message: "The Biomehub backend reported an operational failure"
      web-app-auth-warning:
        type: warning
        message: "The Biomehub backend rejected an OIDC token"
    event_catchers:
      - regex: '(?i)\b(?:playfab )?peer connected:\s*PeerId\('
        event: joined
        emitters:
          - stdout
      - regex: '(?m)^\d{4}/\d{2}/\d{2} \d{2}:\d{2}:\d{2} ERROR (?:configuration error|failed to initialize (?:storage|kubernetes client|auth middleware)|http server error|server shutdown error|ensure catalog entry|failed to (?:read webhook body|parse subscription event)|webhook signature verification failed|stripe event error)\b'
        event: web-app-error
        emitters:
          - stdout
      - regex: '(?m)^(?:\d{4}/\d{2}/\d{2} \d{2}:\d{2}:\d{2} WARN jwtmiddleware error\b|Failed to refresh Dex token Error: Dex rejected the refresh token\b)'
        event: web-app-auth-warning
        emitters:
          - stdout
    event_emitters:
      stdout: {}
---
apiVersion: v1
kind: Service
metadata:
  name: boring-collector
  namespace: boring-logtail-dev
spec:
  selector:
    app.kubernetes.io/name: boring-collector-cri-dev
  ports:
    - name: otlp-http
      port: 4318
      targetPort: otlp-http
    - name: grpc
      port: 50051
      targetPort: grpc
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: boring-collector-cri-dev
  namespace: boring-logtail-dev
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: boring-collector-cri-dev
  template:
    metadata:
      labels:
        app.kubernetes.io/name: boring-collector-cri-dev
        app.kubernetes.io/component: collector
        app.kubernetes.io/part-of: boring-logtail
    spec:
      imagePullSecrets:
        - name: web-app-registry-pull-secret
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 30
      containers:
        - name: boring-collector
          image: registry.gitlab.com/biomehub/boring-logtail/collector:latest
          ports:
            - name: otlp-http
              containerPort: 4318
            - name: grpc
              containerPort: 50051
          env:
            - name: RUST_LOG
              value: info
            - name: BORING_COLLECTOR_CONFIG
              value: /etc/boring-collector/config.yaml
          readinessProbe:
            httpGet:
              path: /healthz
              port: otlp-http
          livenessProbe:
            httpGet:
              path: /healthz
              port: otlp-http
          resources:
            requests:
              cpu: 50m
              memory: 160Mi
            limits:
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: config
              mountPath: /etc/boring-collector
              readOnly: true
      volumes:
        - name: config
          configMap:
            name: boring-collector
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: boring-logtail-cri-dev
  namespace: boring-logtail-dev
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: boring-logtail-cri-dev-pod-reader
rules:
  - apiGroups:
      - ""
    resources:
      - pods
    verbs:
      - get
      - list
      - watch
  - apiGroups:
      - apps
    resources:
      - replicasets
    verbs:
      - get
      - list
      - watch
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: boring-logtail-cri-dev-pod-reader
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: boring-logtail-cri-dev-pod-reader
subjects:
  - kind: ServiceAccount
    name: boring-logtail-cri-dev
    namespace: boring-logtail-dev
---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: boring-logtail-cri-dev
  namespace: boring-logtail-dev
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: boring-logtail-cri-dev
  updateStrategy:
    type: RollingUpdate
  template:
    metadata:
      labels:
        app.kubernetes.io/name: boring-logtail-cri-dev
        app.kubernetes.io/part-of: boring-logtail
    spec:
      imagePullSecrets:
        - name: web-app-registry-pull-secret
      serviceAccountName: boring-logtail-cri-dev
      terminationGracePeriodSeconds: 30
      tolerations:
        - operator: Exists
          effect: NoSchedule
      containers:
        - name: boring-logtail
          image: registry.gitlab.com/biomehub/boring-logtail/logtail:latest
          env:
            - name: RUST_LOG
              value: info
            - name: GLIBC_TUNABLES
              value: "glibc.malloc.arena_max=2:glibc.malloc.trim_threshold=131072"
            - name: BORING_LOGTAIL_NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
            - name: BORING_LOGTAIL_POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: BORING_LOGTAIL_CRI_ROOT
              value: /host/var/log/pods
            - name: BORING_LOGTAIL_CONFIG
              value: /etc/boring-logtail/config.yaml
          resources:
            requests:
              cpu: 25m
              memory: 32Mi
            limits:
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: pod-logs
              mountPath: /host/var/log/pods
              readOnly: true
            - name: config
              mountPath: /etc/boring-logtail
              readOnly: true
      volumes:
        - name: pod-logs
          hostPath:
            path: /var/log/pods
            type: Directory
        - name: config
          configMap:
            name: boring-logtail
