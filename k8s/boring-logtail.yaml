---
apiVersion: v1
kind: ConfigMap
metadata:
  name: boring-logtail
  namespace: boring-logtail-dev
data:
  config.yaml: |
    collector:
      endpoint: http://boring-collector:4317
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: boring-collector
  namespace: boring-logtail-dev
data:
  config.yaml: |
    otlp_grpc_listen: 0.0.0.0:4317
    reader_grpc_listen: 0.0.0.0:50051
    health_listen: 0.0.0.0:13133
    max_request_bytes: 4194304
    loki:
      endpoint: http://loki.observability.svc.cluster.local:3100
      request_timeout_ms: 10000
      max_concurrent_exports: 16
      handoff_buffer: 1024
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: boring-probe
  namespace: boring-logtail-dev
data:
  config.yaml: |
    runtime:
      interval: 15s
    kubelet:
      endpoint: https://{node_name}:10250/stats/summary
      timeout: 5s
    prometheus:
      endpoint: http://prometheus-server.observability.svc.cluster.local/api/v1/write
      timeout: 5s
---
apiVersion: v1
kind: Service
metadata:
  name: boring-collector
  namespace: boring-logtail-dev
spec:
  selector:
    app.kubernetes.io/name: boring-collector-cri-dev
  ports:
    - name: otlp-grpc
      port: 4317
      targetPort: otlp-grpc
    - name: reader-grpc
      port: 50051
      targetPort: reader-grpc
    - name: health
      port: 13133
      targetPort: health
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: boring-collector-cri-dev
  namespace: boring-logtail-dev
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: boring-collector-cri-dev
  template:
    metadata:
      labels:
        app.kubernetes.io/name: boring-collector-cri-dev
        app.kubernetes.io/component: collector
        app.kubernetes.io/part-of: boring-logtail
    spec:
      imagePullSecrets:
        - name: web-app-registry-pull-secret
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 30
      containers:
        - name: boring-collector
          image: ghcr.io/boring-hosting/boring-collector:dev
          ports:
            - name: otlp-grpc
              containerPort: 4317
            - name: reader-grpc
              containerPort: 50051
            - name: health
              containerPort: 13133
          env:
            - name: RUST_LOG
              value: info
            - name: BORING_COLLECTOR_CONFIG
              value: /etc/boring-collector/config.yaml
          readinessProbe:
            httpGet:
              path: /healthz
              port: health
          livenessProbe:
            httpGet:
              path: /healthz
              port: health
          resources:
            requests:
              cpu: 50m
              memory: 160Mi
            limits:
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: config
              mountPath: /etc/boring-collector
              readOnly: true
      volumes:
        - name: config
          configMap:
            name: boring-collector
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: boring-logtail-cri-dev
  namespace: boring-logtail-dev
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: boring-logtail-cri-dev-pod-reader
rules:
  - apiGroups:
      - ""
    resources:
      - pods
    verbs:
      - get
      - list
      - watch
  - apiGroups:
      - apps
    resources:
      - replicasets
    verbs:
      - get
      - list
      - watch
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: boring-logtail-cri-dev-pod-reader
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: boring-logtail-cri-dev-pod-reader
subjects:
  - kind: ServiceAccount
    name: boring-logtail-cri-dev
    namespace: boring-logtail-dev
---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: boring-logtail-cri-dev
  namespace: boring-logtail-dev
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: boring-logtail-cri-dev
  updateStrategy:
    type: RollingUpdate
  template:
    metadata:
      labels:
        app.kubernetes.io/name: boring-logtail-cri-dev
        app.kubernetes.io/part-of: boring-logtail
    spec:
      imagePullSecrets:
        - name: web-app-registry-pull-secret
      serviceAccountName: boring-logtail-cri-dev
      terminationGracePeriodSeconds: 30
      tolerations:
        - operator: Exists
          effect: NoSchedule
      containers:
        - name: boring-logtail
          image: ghcr.io/boring-hosting/boring-logtail:dev
          env:
            - name: RUST_LOG
              value: info
            - name: GLIBC_TUNABLES
              value: "glibc.malloc.arena_max=2:glibc.malloc.trim_threshold=131072"
            - name: BORING_LOGTAIL_NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
            - name: BORING_LOGTAIL_POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: BORING_LOGTAIL_CRI_ROOT
              value: /host/var/log/pods
            - name: BORING_LOGTAIL_CONFIG
              value: /etc/boring-logtail/config.yaml
          resources:
            requests:
              cpu: 25m
              memory: 32Mi
            limits:
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: pod-logs
              mountPath: /host/var/log/pods
              readOnly: true
            - name: config
              mountPath: /etc/boring-logtail
              readOnly: true
      volumes:
        - name: pod-logs
          hostPath:
            path: /var/log/pods
            type: Directory
        - name: config
          configMap:
            name: boring-logtail
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: boring-probe
  namespace: boring-logtail-dev
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: boring-probe-dev-node-stats-reader
rules:
  - apiGroups:
      - ""
    resources:
      - nodes/stats
    verbs:
      - get
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: boring-probe-dev-node-stats-reader
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: boring-probe-dev-node-stats-reader
subjects:
  - kind: ServiceAccount
    name: boring-probe
    namespace: boring-logtail-dev
---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: boring-probe
  namespace: boring-logtail-dev
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: boring-probe
  updateStrategy:
    type: RollingUpdate
  template:
    metadata:
      labels:
        app.kubernetes.io/name: boring-probe
        app.kubernetes.io/component: probe
        app.kubernetes.io/part-of: boring-logtail
    spec:
      imagePullSecrets:
        - name: web-app-registry-pull-secret
      serviceAccountName: boring-probe
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      terminationGracePeriodSeconds: 30
      tolerations:
        - operator: Exists
          effect: NoSchedule
      containers:
        - name: boring-probe
          image: ghcr.io/boring-hosting/boring-probe:dev
          env:
            - name: RUST_LOG
              value: info
            - name: BORING_PROBE_CONFIG
              value: /etc/boring-probe/config.yaml
            - name: BORING_PROBE_NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
          resources:
            requests:
              cpu: 10m
              memory: 24Mi
            limits:
              cpu: 100m
              memory: 96Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: config
              mountPath: /etc/boring-probe
              readOnly: true
      volumes:
        - name: config
          configMap:
            name: boring-probe
