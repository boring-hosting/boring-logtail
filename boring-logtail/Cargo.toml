[package]
name = "boring-logtail"
version = "0.1.0"
edition.workspace = true

license.workspace = true

[dependencies]
blt-model = { path = "../blt-model" }
blt-otel = { path = "../blt-otel" }

anyhow = { workspace = true, default-features = true }
env_logger = { workspace = true }
futures = "0.3"
log = { workspace = true }
jiff = "0.2"
k8s-openapi = { version = "0.28", features = ["latest"] }
kube = { version = "4.2", features = ["runtime"] }
notify = "8.2"
serde = { version = "1", features = ["derive"] }
serde_yaml = "0.9"
tokio = { workspace = true, features = [
    "macros",
    "rt",
    "rt-multi-thread",
    "net",
    "signal",
    "sync",
    "time",
    "test-util",
] }
[dev-dependencies]
serde_json = "1"
tempfile = "3"

[[bin]]
name = "boring-logtail"
path = "src/main.rs"
