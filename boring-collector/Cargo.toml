[package]
name = "boring-collector"
version = "0.1.0"
edition.workspace = true
license.workspace = true

[dependencies]
anyhow = { workspace = true, default-features = true }
async-trait = "0.1"
axum = { workspace = true }
env_logger = { workspace = true }
futures-core = "0.3"
futures-util = "0.3"
log = { workspace = true }
opentelemetry-proto = { workspace = true }
prost = { workspace = true }
prost-types = { workspace = true }
prometheus-client = { workspace = true }
reqwest = { workspace = true, features = ["json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
tokio = { workspace = true, features = ["macros", "net", "rt-multi-thread", "signal"] }
tokio-stream = { workspace = true, features = ["net", "sync"] }
tokio-tungstenite = { version = "0.29", default-features = false, features = [
    "connect",
    "handshake",
    "rustls-tls-webpki-roots",
] }
tonic = { workspace = true, features = ["codegen", "router", "transport"] }
tonic-prost = { workspace = true }
tonic-reflection = "0.14.6"

[dev-dependencies]
axum = { workspace = true, features = ["json", "ws"] }

[build-dependencies]
protoc-bin-vendored = "3"
tonic-prost-build = "0.14"

[lib]
path = "src/lib.rs"

[[bin]]
name = "boring-collector"
path = "src/main.rs"
