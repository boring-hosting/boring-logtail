[package]
name = "boring-collector"
version = "0.1.0"
edition.workspace = true
license.workspace = true

[dependencies]
blt-emitter = { path = "../blt-emitter" }
blt-model = { path = "../blt-model" }
blt-otel = { path = "../blt-otel" }
blt-store = { path = "../blt-store" }

anyhow = { workspace = true, default-features = true }
axum = { workspace = true }
env_logger = { workspace = true }
log = { workspace = true }
opentelemetry-proto = { workspace = true }
prost = { workspace = true }
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_yaml = "0.9"
tokio = { workspace = true, features = ["macros", "net", "rt-multi-thread", "signal"] }

[dev-dependencies]
jiff = "0.2"

[lib]
path = "src/lib.rs"

[[bin]]
name = "boring-collector"
path = "src/main.rs"
